<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domiclaw — Login</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #f0f0f0; color: #222;
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh;
}
.container {
  background: #fff; border: 1px solid #ddd; border-radius: 12px;
  padding: 32px; width: 360px; box-shadow: 0 4px 24px rgba(0,0,0,0.1);
}
h1 { font-size: 22px; margin-bottom: 8px; text-align: center; color: #333; }
.subtitle { color: #999; font-size: 13px; text-align: center; margin-bottom: 24px; }
.tabs { display: flex; gap: 0; margin-bottom: 20px; }
.tabs button {
  flex: 1; padding: 10px; border: 1px solid #ccc;
  background: #f5f5f5; color: #666; cursor: pointer; font-size: 14px;
}
.tabs button:first-child { border-radius: 6px 0 0 6px; }
.tabs button:last-child { border-radius: 0 6px 6px 0; }
.tabs button.active { background: #0a84ff; color: #fff; border-color: #0a84ff; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
.form-group input {
  width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid #ccc;
  background: #fff; color: #222; font-size: 14px; outline: none;
}
.form-group input:focus { border-color: #0a84ff; }
.btn {
  width: 100%; padding: 10px; border-radius: 6px; border: none;
  background: #0a84ff; color: #fff; cursor: pointer; font-size: 14px; margin-top: 8px;
}
.btn:hover { background: #0066cc; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.error { color: #d33; font-size: 13px; text-align: center; margin-top: 12px; }
.success { color: #3a8; font-size: 13px; text-align: center; margin-top: 12px; }
[v-cloak] { display: none; }
/* bug report */
.bug-btn{position:fixed;bottom:16px;right:16px;width:40px;height:40px;border-radius:50%;border:none;background:#e05555;color:#fff;font-size:20px;cursor:pointer;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,.2);opacity:.7;transition:opacity .2s}
.bug-btn:hover{opacity:1}
.bug-modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:10000}
.bug-dialog{background:#fff;border:1px solid #ddd;border-radius:12px;padding:24px;width:420px;max-width:90vw}
.bug-dialog h3{margin-bottom:12px;font-size:16px;color:#333}
.bug-dialog input,.bug-dialog textarea{width:100%;padding:8px 10px;border-radius:6px;border:1px solid #ccc;font-size:13px;margin-bottom:10px;outline:none;font-family:inherit}
.bug-dialog textarea{min-height:80px;resize:vertical}
.bug-dialog input:focus,.bug-dialog textarea:focus{border-color:#0a84ff}
.bug-dialog .bug-meta{font-size:11px;color:#999;margin-bottom:10px;background:#f5f5f5;padding:8px;border-radius:4px;word-break:break-all}
.bug-dialog .bug-actions{display:flex;gap:8px;justify-content:flex-end}
</style>
</head>
<body>

<div class="container" v-cloak>
  <h1>Domiclaw</h1>
  <p class="subtitle">Your AI Study Assistant</p>

  <div class="tabs">
    <button :class="{ active: tab === 'login' }" @click="switchTab('login')">Login</button>
    <button :class="{ active: tab === 'register' }" @click="switchTab('register')">Register</button>
  </div>

  <div v-if="tab === 'login'">
    <div class="form-group">
      <label>Username</label>
      <input v-model="loginUsername" @keyup.enter="doLogin" placeholder="Your username" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input v-model="loginPassword" type="password" @keyup.enter="doLogin" placeholder="Your password" />
    </div>
    <button class="btn" @click="doLogin" :disabled="loading">Login</button>
  </div>

  <div v-if="tab === 'register'">
    <div class="form-group">
      <label>Username</label>
      <input v-model="regUsername" @keyup.enter="doRegister" placeholder="Choose a username" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input v-model="regPassword" type="password" @keyup.enter="doRegister" placeholder="At least 4 characters" />
    </div>
    <button class="btn" @click="doRegister" :disabled="loading">Register</button>
  </div>

  <div v-if="error" class="error">{{ error }}</div>
  <div v-if="success" class="success">{{ success }}</div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
const { ref, onMounted } = Vue;

Vue.createApp({
  setup() {
    const tab = ref('login');
    const loading = ref(false);
    const error = ref('');
    const success = ref('');
    const loginUsername = ref('');
    const loginPassword = ref('');
    const regUsername = ref('');
    const regPassword = ref('');

    async function apiPost(path, body) {
      const r = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      return r.json();
    }

    function switchTab(t) {
      tab.value = t;
      error.value = '';
      success.value = '';
    }

    function redirect(role) {
      if (role === 'admin') {
        window.location.href = '/admin.html';
      } else {
        window.location.href = '/app.html';
      }
    }

    async function doLogin() {
      error.value = '';
      success.value = '';
      if (!loginUsername.value || !loginPassword.value) {
        error.value = 'Please enter username and password.';
        return;
      }
      loading.value = true;
      try {
        const data = await apiPost('/api/auth/login', {
          username: loginUsername.value,
          password: loginPassword.value,
        });
        if (data.error) {
          error.value = data.error;
        } else {
          success.value = 'Login successful! Redirecting...';
          setTimeout(() => redirect(data.role), 500);
        }
      } catch (e) {
        error.value = 'Network error: ' + e.message;
      }
      loading.value = false;
    }

    async function doRegister() {
      error.value = '';
      success.value = '';
      if (!regUsername.value || !regPassword.value) {
        error.value = 'Please enter username and password.';
        return;
      }
      if (regPassword.value.length < 4) {
        error.value = 'Password must be at least 4 characters.';
        return;
      }
      loading.value = true;
      try {
        const data = await apiPost('/api/auth/register', {
          username: regUsername.value,
          password: regPassword.value,
        });
        if (data.error) {
          error.value = data.error;
        } else {
          success.value = 'Account created! Redirecting...';
          setTimeout(() => redirect(data.role), 500);
        }
      } catch (e) {
        error.value = 'Network error: ' + e.message;
      }
      loading.value = false;
    }

    // Check if already logged in
    onMounted(async () => {
      try {
        const r = await fetch('/api/auth/me');
        const data = await r.json();
        if (data.id) {
          redirect(data.role);
        }
      } catch { /* not logged in, stay */ }
    });

    return {
      tab, loading, error, success,
      loginUsername, loginPassword, regUsername, regPassword,
      switchTab, doLogin, doRegister,
    };
  }
}).mount('.container');
</script>

<!-- Bug Report -->
<button class="bug-btn" onclick="toggleBug()" title="Report Bug">&#x1F41B;</button>
<div class="bug-modal" id="bugModal" style="display:none" onclick="if(event.target===this)toggleBug()">
<div class="bug-dialog">
<h3>&#x1F41B; Report Bug</h3>
<input id="bugTitle" placeholder="Bug title" />
<textarea id="bugDesc" placeholder="Description (optional)"></textarea>
<div class="bug-meta" id="bugMeta"></div>
<div class="bug-actions">
<button onclick="toggleBug()" style="padding:6px 14px;border-radius:6px;border:1px solid #ccc;background:#f5f5f5;cursor:pointer;font-size:13px">Cancel</button>
<button onclick="submitBug()" style="padding:6px 14px;border-radius:6px;border:none;background:#0a84ff;color:#fff;cursor:pointer;font-size:13px">Submit</button></div></div></div>
<script>
function toggleBug(){var m=document.getElementById('bugModal');m.style.display=m.style.display==='none'?'flex':'none';if(m.style.display==='flex'){document.getElementById('bugMeta').textContent=location.href+' | '+navigator.userAgent.substring(0,80)+' | '+new Date().toISOString()}}
async function submitBug(){var t=document.getElementById('bugTitle').value.trim();if(!t){alert('Title required');return};var d=document.getElementById('bugDesc').value.trim();var p=document.getElementById('bugMeta').textContent;var r=await fetch('/api/bug-report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:t,description:d,page:p})});var j=await r.json();if(j.id){alert('Bug #'+j.id+' reported. Thanks!');toggleBug();document.getElementById('bugTitle').value='';document.getElementById('bugDesc').value=''}else{alert('Failed: '+(j.error||'unknown'))}}
</script>
</body>
</html>
